# GranitePython: Granite's agent kernel and the granite-agent/1 standard in Python, standard library only.
# `pip install .` gives the `granite` command; scripts/build-cli.sh makes the same command as one file.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "granite-python"
version = "0.1.0"
description = "Granite's agent kernel and the granite-agent/1 standard in Python: write agents, and host them."
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/riteshpakala/GranitePython"

[project.scripts]
granite = "granite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
